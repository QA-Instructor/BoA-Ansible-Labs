- hosts: localhost
  connection: local
  become: true
  tasks:
  - name: Install nginx
    apt:
      name: nginx
      state: present
      update_cache: true
      
  - name: Copy nginx conf file
    copy:
      src: nginx.conf
      dest: /etc/nginx/nginx.conf
    register: nginx_config # register the task output as a variable for later use

  - name: Restart nginx
    service:
      name: nginx
      state: restarted
      